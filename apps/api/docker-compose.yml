services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doctrack
      POSTGRES_USER: doctrack
      POSTGRES_PASSWORD: doctrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host 5433 → container 5432, to avoid clashing with another local Postgres.
      # Internal traffic still uses db:5432 over the compose network (DATABASE_URL unchanged).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctrack -d doctrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: .env
    ports:
      # Host 8001 → container 8000. Frontend points here via apps/web/.env (VITE_API_URL).
      - "8001:8000"
    volumes:
      - .:/app
      - app_venv:/app/.venv
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn doctrack.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  app_venv:
